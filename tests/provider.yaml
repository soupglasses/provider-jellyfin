apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: jellyfin
spec:
  package: ghcr.io/soupglasses/provider-jellyfin:v0.4.0@sha256:a89c9f0b5445e1a7a4ec93772d0f60393905e46cd2a54cd8c0f32ca0b7fef68f
  revisionHistoryLimit: 2
  runtimeConfigRef:
    name: provider-jellyfin
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-jellyfin
spec:
  serviceAccountTemplate:
    metadata:
      name: jellyfin-provider
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin-provider
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              args: ["--poll-interval=2s"]
              env:
                - name: WATCH_NAMESPACE
                  value: media
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 8081
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: 8081
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop: [ALL]
