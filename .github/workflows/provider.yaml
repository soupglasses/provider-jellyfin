name: Provider
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Build cached amd64 controller image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: provider-jellyfin:amd64-development
          cache-from: |
            type=gha,scope=provider-amd64
            type=gha,scope=provider
          cache-to: type=gha,mode=max,scope=provider-amd64
      - name: Build cached arm64 controller image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          load: true
          tags: provider-jellyfin:arm64-development
          cache-from: |
            type=gha,scope=provider-arm64
            type=gha,scope=provider
          cache-to: type=gha,mode=max,scope=provider-arm64
      - name: Build native package from verified images
        run: |
          for arch in amd64 arm64; do
            crossplane xpkg build --package-root package --embed-runtime-image "provider-jellyfin:$arch-development" --package-file "/tmp/provider-jellyfin-$arch.xpkg"
          done
      - name: Export cached generated files
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: generated
          outputs: type=local,dest=/tmp/jellyfin-generated
          cache-from: |
            type=gha,scope=provider-amd64
            type=gha,scope=provider
      - name: Export cached coverage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: coverage
          outputs: type=local,dest=/tmp/coverage
          cache-from: |
            type=gha,scope=provider-amd64
            type=gha,scope=provider
      - name: Verify generated files are reproducible
        run: |
          diff -r package/crds /tmp/jellyfin-generated/package/crds
          diff -r apis /tmp/jellyfin-generated/apis
          diff -r internal/controller /tmp/jellyfin-generated/internal/controller
          diff config/schema.json /tmp/jellyfin-generated/config/schema.json
      - name: Verify native Jellyfin reconciliation
        env:
          PROVIDER_PACKAGE: /tmp/provider-jellyfin-amd64.xpkg
          TEST_ARTIFACTS_DIR: /tmp/native-reports
        run: bash kind-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            /tmp/coverage/coverage.out
            /tmp/native-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-package
          path: /tmp/provider-jellyfin-*.xpkg
          if-no-files-found: error
  publish:
    timeout-minutes: 10
    needs: provider
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref,
      'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Download verified native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name provider-package --dir
          /tmp/release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: aqua:crossplane/cli
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          numeric = r"(?:0|[1-9][0-9]*)"
          identifier = rf"(?:{numeric}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          version = rf"v{numeric}\.{numeric}\.{numeric}(?:-{identifier}(?:\.{identifier})*)?"
          if re.fullmatch(version, os.environ["GITHUB_REF_NAME"]) is None:
              raise SystemExit("Release tags must be OCI-compatible semantic versions, such as v1.2.3 or v1.2.3-rc.1")
          PYTHON
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Reject an existing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; publish a new version." >&2
            exit 1
          fi
      - name: Publish native Provider package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="v0.0.0-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          fi
          crossplane xpkg push --package-files /tmp/release/provider-jellyfin-amd64.xpkg,/tmp/release/provider-jellyfin-arm64.xpkg --oci-annotation org.opencontainers.image.revision="$GITHUB_SHA" --oci-annotation org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" "ghcr.io/soupglasses/provider-jellyfin:$version"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! docker --config "$anonymous_config" manifest inspect "ghcr.io/soupglasses/provider-jellyfin:$version" > /tmp/provider-index.json; then
            echo 'Published package is not anonymously installable; check its GHCR visibility.' >&2
            exit 1
          fi
          jq --exit-status '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' /tmp/provider-index.json
      - name: Publish release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /tmp/release
        run: |
          sha256sum provider-jellyfin-amd64.xpkg provider-jellyfin-arm64.xpkg > SHA256SUMS
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" provider-jellyfin-amd64.xpkg provider-jellyfin-arm64.xpkg SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_args[@]}"
