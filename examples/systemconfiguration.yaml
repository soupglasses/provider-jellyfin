apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: SystemConfiguration
metadata:
  name: jellyfin
  namespace: media
  annotations:
    crossplane.io/external-name: system
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    serverName: Jellyfin
    uiCulture: en-US
    metadataCountryCode: US
    preferredMetadataLanguage: en
