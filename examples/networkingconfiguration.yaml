apiVersion: jellyfin.finnes.dev/v1alpha1
kind: NetworkingConfiguration
metadata:
  name: jellyfin
  namespace: media
  annotations:
    crossplane.io/external-name: networking
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    enableUpnp: false
    enableRemoteAccess: true
