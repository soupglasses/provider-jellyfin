apiVersion: v1
kind: Secret
metadata:
  name: jellyfin-identity
  namespace: media
stringData:
  password: replace-with-the-administrator-password
---
apiVersion: jellyfin.ops.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: jellyfin
  namespace: media
spec:
  endpoint: http://jellyfin.media.svc.cluster.local:8096
  username: administrator
  passwordSecretRef:
    name: jellyfin-identity
    key: password
